<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 Minute Timer</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:transparent;overflow:hidden;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:flex-start;
    color:#222;
  }
  .wrap{
    height:36px;
    display:flex;align-items:center;
    gap:7px;white-space:nowrap;
    padding:0 2px;
  }
  #time{
    font-size:20px;line-height:36px;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.6px;
    cursor:pointer;user-select:none;
  }
  button{
    border:0;background:transparent;color:#888;
    padding:0 2px;height:30px;
    font:inherit;font-size:12px;line-height:30px;
    cursor:pointer;
  }
  button:hover{color:#222}
  .reset{font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <span id="time" title="클릭해서 시작/일시정지">15:00</span>
  <button id="start" aria-label="Start/Pause">▶</button>
  <button id="reset" class="reset" aria-label="Reset">↻</button>
</div>
<script>
let remaining=15*60, timer=null;
const time=document.getElementById('time');
const start=document.getElementById('start');
const reset=document.getElementById('reset');

function render(){
  const m=Math.floor(remaining/60).toString().padStart(2,'0');
  const s=(remaining%60).toString().padStart(2,'0');
  time.textContent=`${m}:${s}`;
  start.textContent=timer?'Ⅱ':'▶';
}
function playDoneSound(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    const ctx=new Ctx();
    const now=ctx.currentTime;
    [0,0.16].forEach((offset,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type="sine";
      osc.frequency.value=i===0?660:880;
      gain.gain.setValueAtTime(0.0001,now+offset);
      gain.gain.exponentialRampToValueAtTime(0.16,now+offset+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.20);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now+offset);
      osc.stop(now+offset+0.22);
    });
  }catch(e){}
}
function toggle(){
  if(timer){clearInterval(timer);timer=null;render();return;}
  if(remaining<=0) remaining=15*60;
  timer=setInterval(()=>{
    remaining--;
    if(remaining<=0){
      remaining=0;clearInterval(timer);timer=null;
      playDoneSound();
    }
    render();
  },1000);
  render();
}
function doReset(){
  clearInterval(timer);timer=null;remaining=15*60;render();
}
time.onclick=toggle;
start.onclick=toggle;
reset.onclick=doReset;
render();
</script>
</body>
</html>
